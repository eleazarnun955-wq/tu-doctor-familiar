name: Android APK
on:
  push:
    branches: [main, doctor-familiar-2.0, doctor-familiar-3.0, doctor-familiar-4.0, doctor-familiar-5.0, doctor-familiar-6.0, doctor-familiar-8.0]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4
      - name: Configurar Java 21 para Android Lint
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Crear estructura Android independiente V8 si falta
        run: |
          if [ ! -d android ]; then
            flutter create --org com.tudoctorfamiliar.v8 --platforms=android --project-name=tu_doctor_familiar .
          fi
      - name: Configurar identidad, permisos y notificaciones Android
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          manifest = Path('android/app/src/main/AndroidManifest.xml')
          s = manifest.read_text()
          for permission in ['android.permission.RECORD_AUDIO', 'android.permission.POST_NOTIFICATIONS', 'android.permission.RECEIVE_BOOT_COMPLETED', 'android.permission.VIBRATE']:
              line = f'    <uses-permission android:name="{permission}" />'
              if permission not in s:
                  pos = s.find('>', s.find('<manifest')) + 1
                  s = s[:pos] + '\n' + line + s[pos:]
          s = re.sub(r'android:label="[^"]+"', 'android:label="TU DOCTOR FAMILIAR 8.0"', s, count=1)
          receivers = '''
                  <receiver android:exported="false" android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationReceiver" />
                  <receiver android:exported="false" android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationBootReceiver">
                      <intent-filter>
                          <action android:name="android.intent.action.BOOT_COMPLETED"/>
                          <action android:name="android.intent.action.MY_PACKAGE_REPLACED"/>
                          <action android:name="android.intent.action.QUICKBOOT_POWERON" />
                          <action android:name="com.htc.intent.action.QUICKBOOT_POWERON"/>
                      </intent-filter>
                  </receiver>
          '''
          if 'ScheduledNotificationReceiver' not in s:
              s = s.replace('</application>', receivers + '\n        </application>')
          manifest.write_text(s)
          gradle = Path('android/app/build.gradle')
          if gradle.exists():
              g = gradle.read_text()
              g = re.sub(r'applicationId "[^"]+"', 'applicationId "com.tudoctorfamiliar.v8.tu_doctor_familiar"', g)
              g = re.sub(r'compileOptions\s*\{', 'compileOptions {\n        coreLibraryDesugaringEnabled true', g, count=1) if 'compileOptions' in g else g
              if 'coreLibraryDesugaringEnabled' not in g:
                  g = g.replace('android {', 'android {\n    compileOptions {\n        coreLibraryDesugaringEnabled true\n        sourceCompatibility JavaVersion.VERSION_17\n        targetCompatibility JavaVersion.VERSION_17\n    }', 1)
              if 'coreLibraryDesugaring ' not in g:
                  g += '\ndependencies {\n    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.4"\n}\n'
              gradle.write_text(g)
          gradle_kts = Path('android/app/build.gradle.kts')
          if gradle_kts.exists():
              g = gradle_kts.read_text()
              g = re.sub(r'applicationId = "[^"]+"', 'applicationId = "com.tudoctorfamiliar.v8.tu_doctor_familiar"', g)
              if 'isCoreLibraryDesugaringEnabled' not in g:
                  g = g.replace('compileOptions {', 'compileOptions {\n        isCoreLibraryDesugaringEnabled = true\n        sourceCompatibility = JavaVersion.VERSION_17\n        targetCompatibility = JavaVersion.VERSION_17', 1)
              if 'coreLibraryDesugaring(' not in g:
                  g += '\ndependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")\n}\n'
              gradle_kts.write_text(g)
          PY
      - name: Instalar dependencias
        run: flutter pub get
      - name: Analizar código
        run: dart analyze
      - name: Ejecutar pruebas
        run: flutter test
      - name: Compilar APK independiente
        run: flutter build apk --release
      - name: Guardar APK V8.0
        uses: actions/upload-artifact@v4
        with:
          name: TU-DOCTOR-FAMILIAR-8.0-Android
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publicar APK V8.0 para descarga pública gratuita
        if: github.ref == 'refs/heads/doctor-familiar-8.0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk TU-DOCTOR-FAMILIAR-8.0.apk
          if gh release view v8.0.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload v8.0.0 TU-DOCTOR-FAMILIAR-8.0.apk --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit v8.0.0 --title "TU DOCTOR FAMILIAR 8.0" --notes "Aplicación gratuita de seguimiento personal y educación para la salud. No sustituye la atención médica, no diagnostica, no prescribe, no calcula dosis ni modifica tratamientos. Los registros se almacenan localmente en el dispositivo y no se sincronizan automáticamente entre dispositivos. Consulta siempre con un profesional de salud. No uses la aplicación para atender emergencias. La compilación automatizada no sustituye las pruebas funcionales en dispositivos reales." --latest --repo "$GITHUB_REPOSITORY"
          else
            gh release create v8.0.0 TU-DOCTOR-FAMILIAR-8.0.apk --title "TU DOCTOR FAMILIAR 8.0" --notes "Aplicación gratuita de seguimiento personal y educación para la salud. No sustituye la atención médica, no diagnostica, no prescribe, no calcula dosis ni modifica tratamientos. Los registros se almacenan localmente en el dispositivo y no se sincronizan automáticamente entre dispositivos. Consulta siempre con un profesional de salud. No uses la aplicación para atender emergencias. La compilación automatizada no sustituye las pruebas funcionales en dispositivos reales." --target "$GITHUB_SHA" --latest --repo "$GITHUB_REPOSITORY"
          fi
