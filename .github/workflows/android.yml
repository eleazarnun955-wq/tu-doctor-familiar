name: Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4
      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Crear estructura móvil si falta
        run: |
          if [ ! -d android ] || [ ! -d ios ]; then
            flutter create --platforms=android,ios --project-name=tu_doctor_familiar .
          fi
      - name: Instalar dependencias
        run: flutter pub get
      - name: Analizar código
        run: dart analyze
      - name: Ejecutar pruebas de seguridad
        run: flutter test
      - name: Compilar APK
        run: flutter build apk --release
      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: TU-DOCTOR-FAMILIAR-Android
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
