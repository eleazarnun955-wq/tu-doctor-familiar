name: Android APK
on:
  push:
    branches: [main, doctor-familiar-2.0, doctor-familiar-3.0]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4
      - name: Configurar Java 21 para Android Gradle y Lint
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Crear estructura móvil si falta
        run: |
          if [ ! -d android ] || [ ! -d ios ]; then
            flutter create --org com.tudoctorfamiliar.v3 --platforms=android,ios --project-name=tu_doctor_familiar .
          fi
      - name: Configurar permiso de micrófono
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text()
          permission = '    <uses-permission android:name="android.permission.RECORD_AUDIO" />\\n'
          if 'android.permission.RECORD_AUDIO' not in s:
              i = s.find('>') + 1
              s = s[:i] + '\\n' + permission + s[i:]
          s = s.replace('android:label="tu_doctor_familiar"', 'android:label="TU DOCTOR FAMILIAR 3.0"')
          p.write_text(s)
          PY
      - name: Instalar dependencias
        run: flutter pub get
      - name: Analizar código
        run: dart analyze
      - name: Ejecutar pruebas de seguridad
        run: flutter test
      - name: Compilar APK
        run: flutter build apk --release
      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: TU-DOCTOR-FAMILIAR-3.0-Android
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
