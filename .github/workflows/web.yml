name: Diagnóstico de runner web V8.0
on:
  push:
    branches: [doctor-familiar-8.0]
permissions:
  contents: read
jobs:
  runner-diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Verificar disponibilidad del runner
        run: |
          echo "RUNNER_OK"
          echo "Sistema: $(uname -a)"
          echo "Directorio: $GITHUB_WORKSPACE"
