name: tu_doctor_familiar
description: Aplicación educativa y de seguimiento personal para diabetes y bienestar familiar.
publish_to: 'none'
version: 5.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.5.3
  share_plus: ^10.1.4
  flutter_secure_storage: ^9.2.4
  cryptography: ^2.7.0
  pdf: ^3.11.3
  printing: ^5.14.2
  url_launcher: ^6.3.1
  speech_to_text: ^7.0.0
  flutter_local_notifications: ^19.4.0
  timezone: ^0.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
